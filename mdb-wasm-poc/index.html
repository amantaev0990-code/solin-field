<!doctype html><html lang="ru"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<base href="/solin-field/mdb-wasm-poc/" />
<title>SOLI-N · Тест конвертера MDB</title>
<style>
body{background:#eff5f0;color:#143622;font:16px system-ui,-apple-system,sans-serif;margin:0;padding:20px}
.shell{max-width:600px;margin:30px auto;background:white;border-radius:18px;padding:26px;box-shadow:0 2px 12px #15372616}
h1{font-size:24px}button{background:#18784b;color:white;font-weight:700;padding:15px;border:0;border-radius:12px;font-size:16px;width:100%}
button:disabled{opacity:.5}button.secondary{margin-top:12px;background:#235b83}#download-area a{display:block;background:#0b6741;color:#fff;text-align:center;padding:14px;border-radius:12px;font-weight:bold;text-decoration:none;margin:20px auto}#download-area:empty{display:none}.status{white-space:pre-wrap;line-height:1.6}.note{color:#60786d;font-size:14px}
</style></head>
<body><div id="app">Загружаю отдельный тестовый конвертер…</div>
<div id="download-area"></div>
<script>
/* Diagnostic fallback for a missing or stalled Blazor runtime. Never touches
   SOLI-N workspace records. The live Blazor UI replaces this on success. */
(function solinBootWatchdog(){
 'use strict';
 const app=document.getElementById('app');
 let failureReason='';
 const ready=()=>!!app.querySelector('button');
 const record=message=>{if(!failureReason)failureReason=String(message||'Неизвестная ошибка').slice(0,240);};
 function failure(reason) {
  if(ready())return;
  const box=document.createElement('section');box.className='shell';
  const title=document.createElement('h1');title.textContent='Конвертер не загрузился';
  const message=document.createElement('p');
  message.textContent=reason||'Не удалось запустить WebAssembly. Проверьте сеть и откройте страницу повторно.';
  const note=document.createElement('p');note.className='note';
  note.textContent='Карточки SOLI-N Field не изменены. Файл MDB не создавался.';
  const retry=document.createElement('button');
  retry.type='button';retry.textContent='Повторить загрузку';
  retry.onclick=()=>{const url=new URL(location.href);url.searchParams.set('retry',Date.now());location.replace(url.href);};
  const back=document.createElement('button');
  back.className='secondary';back.type='button';back.textContent='Вернуться в SOLI-N Field';
  back.onclick=()=>location.assign('../');
  box.append(title,message,note,retry,back);
  app.replaceChildren(box);
 }
 window.addEventListener('error',event=>{
  const target=event.target;
  if(target?.tagName==='SCRIPT'&&target.src?.includes('blazor.webassembly.js')) {
   failure('Не загрузился файл _framework/blazor.webassembly.js. Это ошибка публикации GitHub Pages или сети.');
  }else if(event.message)record(event.message);
 },true);
 window.addEventListener('unhandledrejection',event=>record(event.reason?.message||event.reason));
 setTimeout(()=>{if(!ready())failure(failureReason
   ? 'Ошибка запуска: '+failureReason
   : 'WebAssembly не запустился. Возможна недоступность файлов _framework или ошибка загрузки в Safari.');
 },30000);
})();
</script>
<script>
let lastMdbUrl;
window.saveMdbTest=(name,bytes)=>{
 const blob=new Blob([bytes],{type:'application/vnd.ms-access'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=name;a.textContent='Сохранить тестовый MDB в Файлы';
 a.setAttribute('aria-label','Сохранить '+name);
 document.getElementById('download-area').replaceChildren(a);
 if(lastMdbUrl)URL.revokeObjectURL(lastMdbUrl);
 lastMdbUrl=url;
 // Safari sometimes blocks downloads after an asynchronous WebAssembly call.
 // The link remains available for a manual, trusted tap.
 try {a.click();}catch(e){}
};
</script>
<script src="workspace-reader.js"></script>
<script src="_framework/blazor.webassembly.js"></script></body></html>
