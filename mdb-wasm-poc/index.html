<!doctype html><html lang="ru"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<base href="/solin-field/mdb-wasm-poc/" />
<title>SOLI-N · Экспорт MDB</title>
<style>
body{background:#eff5f0;color:#143622;font:16px system-ui,-apple-system,sans-serif;margin:0;padding:20px}
.shell{max-width:600px;margin:30px auto;background:white;border-radius:18px;padding:26px;box-shadow:0 2px 12px #15372616}
h1{font-size:24px}button{background:#18784b;color:white;font-weight:700;padding:15px;border:0;border-radius:12px;font-size:16px;width:100%}
button:disabled{opacity:.5}button.secondary{margin-top:12px;background:#235b83}#download-area a{display:block;background:#0b6741;color:#fff;text-align:center;padding:14px;border-radius:12px;font-weight:bold;text-decoration:none;margin:20px auto}#download-area:empty{display:none}.status{white-space:pre-wrap;line-height:1.6}.note{color:#60786d;font-size:14px}
</style></head>
<body><div id="app">Подготавливаю экспорт MDB…</div>
<div id="download-area"></div>
<script>
/* Diagnostic fallback for a missing or stalled Blazor runtime. Never touches
   SOLI-N workspace records. The live Blazor UI replaces this on success. */
(function solinBootWatchdog(){
 'use strict';
 const app=document.getElementById('app');
 let failureReason='';
 const ready=()=>!!app.querySelector('button');
 const record=message=>{if(!failureReason)failureReason=String(message||'Неизвестная ошибка').slice(0,240);};
 function failure(reason) {
  if(ready())return;
  const box=document.createElement('section');box.className='shell';
  const title=document.createElement('h1');title.textContent='Конвертер не загрузился';
  const message=document.createElement('p');
  message.textContent=reason||'Не удалось запустить WebAssembly. Проверьте сеть и откройте страницу повторно.';
  const note=document.createElement('p');note.className='note';
  note.textContent='Карточки SOLI-N Field не изменены. Файл MDB не создавался.';
  const retry=document.createElement('button');
  retry.type='button';retry.textContent='Повторить загрузку';
  retry.onclick=()=>{const url=new URL(location.href);url.searchParams.set('retry',Date.now());location.replace(url.href);};
  const back=document.createElement('button');
  back.className='secondary';back.type='button';back.textContent='Вернуться в SOLI-N Field';
  back.onclick=()=>location.assign('../');
  box.append(title,message,note,retry,back);
  app.replaceChildren(box);
  window.solinReportMdbError?.(reason);
 }
 window.addEventListener('error',event=>{
  const target=event.target;
  if(target?.tagName==='SCRIPT'&&target.src?.includes('blazor.webassembly.js')) {
   failure('Не загрузился файл _framework/blazor.webassembly.js. Это ошибка публикации GitHub Pages или сети.');
  }else if(event.message)record(event.message);
 },true);
 window.addEventListener('unhandledrejection',event=>record(event.reason?.message||event.reason));
 setTimeout(()=>{if(!ready())failure(failureReason
   ? 'Ошибка запуска: '+failureReason
   : 'WebAssembly не запустился. Возможна недоступность файлов _framework или ошибка загрузки в Safari.');
 },30000);
})();
</script>
<script>
let lastMdbUrl;
const solinParams=new URL(location.href).searchParams;
const solinEmbed=window.parent!==window && solinParams.get('embed')==='1' && !!solinParams.get('token');
let solinErrorSent=false;
window.solinShouldAutoExport=()=>solinParams.get('export')==='1';
window.solinReportMdbError=reason=>{
 if(!solinEmbed || solinErrorSent)return;
 solinErrorSent=true;
 window.parent.postMessage({
   type:'solin-mdb-error',token:solinParams.get('token'),
   error:String(reason||'Не удалось создать MDB.').slice(0,400)
 },location.origin);
};
window.saveMdb=(name,bytes)=>{
 if(!/^Transf_[0-9]+_[0-9]+_[0-9]+\.mdb$/.test(name))throw Error('Некорректное имя MDB.');
 const view=new Uint8Array(bytes);
 if(view.byteLength<2048 || String.fromCharCode(...view.slice(4,19))!=='Standard Jet DB')
   throw Error('Созданный файл не является базой Access MDB.');
 if(solinEmbed){
   // The parent SOLI-N Field page owns the download and remains visible.
   const transferBytes=view.slice().buffer;
   window.parent.postMessage({
     type:'solin-mdb-ready',token:solinParams.get('token'),
     name,bytes:transferBytes
   },location.origin,[transferBytes]);
   return;
 }
 const blob=new Blob([bytes],{type:'application/vnd.ms-access'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=name;a.textContent='Сохранить MDB';
 a.setAttribute('aria-label','Сохранить MDB: '+name);
 document.getElementById('download-area').replaceChildren(a);
 if(lastMdbUrl)URL.revokeObjectURL(lastMdbUrl);
 lastMdbUrl=url;
 // Safari sometimes blocks downloads after an asynchronous WebAssembly call.
 // The link remains available for a manual, trusted tap.
 try {a.click();}catch(e){}
};
// Transitional alias only for a stale cached test binary. The latest build
// invokes saveMdb directly and uses the canonical filename.
window.saveMdbTest=(name,bytes)=>window.saveMdb(name.replace(/^TEST_/,''),bytes);
// Also handle errors emitted by an older cached .NET binary that cannot
// directly invoke solinReportMdbError. The frame itself remains invisible.
if(solinEmbed){
 const failureObserver=new MutationObserver(()=>{
   const status=document.querySelector('#app [role="status"]')?.textContent||'';
   if(/^(?:Экспорт остановлен|Ошибка WebAssembly)/.test(status.trim()))
     window.solinReportMdbError(status.trim());
 });
 failureObserver.observe(document.getElementById('app'),{subtree:true,childList:true,characterData:true});
}
</script>
<script>
/* For a previously cached, already running two-button WASM binary: present
   exactly the same single Export action and run it once after Field navigation.
   Automatically becomes inactive when the new one-button binary is published. */
(function(){
 const app=document.getElementById('app');
 let automaticallyStarted=false;
 const simplify=()=>{
   const shell=app.querySelector('.shell');
   if(!shell)return;
   const buttons=[...shell.querySelectorAll(':scope > button')];
   if(buttons.length!==2)return;
   shell.querySelectorAll('h1,.note').forEach(node=>{if(!node.hidden)node.hidden=true;});
   if(!buttons[0].hidden)buttons[0].hidden=true;
   const exportButton=buttons[1];
   if(!exportButton.disabled && exportButton.textContent!=='Экспорт')
     exportButton.textContent='Экспорт';
   if(!automaticallyStarted && window.solinShouldAutoExport?.() && !exportButton.disabled){
     automaticallyStarted=true;
     exportButton.click();
   }
 };
 new MutationObserver(simplify).observe(app,{childList:true,subtree:true});
 simplify();
})();
</script>
<script src="workspace-reader.js"></script>
<script src="_framework/blazor.webassembly.js"></script></body></html>
