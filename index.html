<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#062514"><title>SOLI-N Field</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css?v=20260907-2"><link rel="stylesheet" href="ui-patch.css?v=20260907-7">
</head><body><div class="app">
<header class="topbar"><div class="brand"><span class="tree">▲</span><div><h1>SOLI-N Field</h1><p>Таксация в поле</p></div></div><div class="topactions"><button class="ghost" onclick="toast('Офлайн-режим активен')">⌁ Офлайн</button><button class="iconbtn" onclick="show('quartersScreen')">⌕</button><button class="iconbtn" onclick="show('menuScreen')">⚙</button></div></header>
<section class="forestCard"><div class="forestTitle"><span class="forestIcon">▲</span><div class="grow"><h2>Бугетсайское лесничество</h2><p>Карабутакское государственное учреждение лесного хозяйства</p></div><button class="change" onclick="toast('Выбор лесничества добавим следующим шагом')">Сменить ›</button></div><div class="stats"><div class="stat"><span>▦</span><b id="qcount">…</b><small>Кварталов</small></div><div class="stat"><span>⬠</span><b id="vcount">…</b><small>Выделов</small></div><div class="stat"><span>▲</span><b id="area">…</b><small>Площадь, га</small></div><div class="stat"><span>◉</span><b id="rcount">…</b><small>Справочников</small></div></div></section>
<div class="quickActions"><button class="primary" onclick="openQuarterForm()">▦ <b>+ Создать квартал</b></button><button class="secondary" onclick="locate()">⌖ <b>GPS-точка</b></button></div>
<nav class="sectionTabs"><button class="sectionTab" data-s="map" onclick="toast('Карта будет подключена позже')">◈<span>Карта</span></button><button class="sectionTab active" data-s="quartersScreen" onclick="show('quartersScreen')">▦<span>Кварталы</span></button><button class="sectionTab" data-s="allCompsScreen" onclick="show('allCompsScreen')">⬠<span>Выделы</span></button><button class="sectionTab" data-s="refsScreen" onclick="show('refsScreen')">◉<span>Справочники</span></button><button class="sectionTab" data-s="menuScreen" onclick="show('menuScreen')">☰<span>Ещё</span></button></nav>
<section id="quartersScreen" class="screen active"><div class="workspace"><div class="screenHead"><h2>▦ Кварталы <span id="qheadCount"></span></h2><button class="iconbtn" onclick="toggleQuarterSearch()">⌕</button></div><div id="qSearch" class="hidden"><input placeholder="Номер квартала…" oninput="renderQuarters(this.value)"></div><button class="widePrimary" onclick="openQuarterForm()">＋ Создать новый квартал</button><div id="quarters"></div></div></section>
<section id="allCompsScreen" class="screen"><div class="workspace"><div class="screenHead"><h2>⬠ Выделы <span id="vheadCount"></span></h2><button class="iconbtn" onclick="toggleCompSearch()">⌕</button></div><div id="vSearch" class="hidden"><input placeholder="Квартал или номер выдела…" oninput="renderAllComps(this.value)"></div><div id="allComps"></div></div></section>
<section id="card" class="screen"><div class="workspace"><div class="screenHead"><div><h2 id="cardTitle"></h2><p id="cardSub"></p></div><button class="iconbtn" onclick="show('quartersScreen')">‹</button></div><div id="humanContent"></div><div id="childTabs" class="chips"></div><div id="childContent"></div></div></section>
<section id="refsScreen" class="screen"><div class="workspace"><div class="screenHead"><div><h2>Справочники SOLI-N</h2><p>Понятные названия из Solim.mdb</p></div></div><input placeholder="Искать название или шифр…" oninput="renderFriendlyRefs(this.value)"><div id="friendlyRefs"></div></div></section>
<section id="menuScreen" class="screen"><div class="workspace"><h2>Ещё</h2><button class="menuRow" onclick="exportTransfer()"><span><b>Экспорт Transfer</b><small>Файл для переноса данных в SOLI-N</small></span><span>⇩</span></button></div></section>
</div>
<div id="modal" class="modal hidden"><div class="modalCard"><div class="modalHead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="app.js?v=20260907-1"></script><script src="ui-patch.js?v=20260907-3"></script><script src="transfer-export.js?v=20260907-1"></script></body></html>
