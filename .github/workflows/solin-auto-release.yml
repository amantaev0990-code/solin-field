name: SOLI-N Field - signed automatic updates

# Push a reviewed solin-field-vNNNNNN tag to build, sign and publish.
# Manual runs create a signed candidate unless publish=true is selected.
on:
  push:
    tags: ['solin-field-v*']
    # Changes to the release pipeline trigger a signed DRY RUN on a pinned,
    # reviewed commit. They never publish to GitHub Releases.
    branches: [main]
    paths: ['.github/workflows/solin-auto-release.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed source branch or commit'
        required: true
        default: '064bfffdcfb23362e892206a5b744c081d9036be'
        type: string
      version_code:
        description: 'Android versionCode: auto or explicit numeric value'
        required: true
        default: 'auto'
        type: string
      publish:
        description: 'Publish PUBLIC release after successful checks'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: solin-automatic-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions: {contents: read}
    outputs:
      code: ${{ steps.meta.outputs.code }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release version and source
        id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_SOURCE: ${{ inputs.source_ref }}
          INPUT_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" = push && "$TAG" = main ]]; then
            # A self-check verifies signing but cannot publish a release.
            CODE='auto'
            SOURCE='064bfffdcfb23362e892206a5b744c081d9036be'
          elif [[ "$EVENT" = push ]]; then
            [[ "$TAG" =~ ^solin-field-v([0-9]{6,9})$ ]] || { echo "::error::Invalid tag"; exit 1; }
            CODE="${BASH_REMATCH[1]}"
            SOURCE="$TAG"
          else
            CODE="$INPUT_CODE"
            SOURCE="$INPUT_SOURCE"
          fi
          if [[ "$CODE" == 'auto' ]]; then
            # The tablet can have V29 / V30 while the public latest is V25.
            # Never issue a version below V31 in automatic mode.
            LATEST="$(gh api repos/amantaev0990-code/solin-field/releases/latest --jq '.tag_name' 2>/dev/null || true)"
            BASE=230010
            if [[ "$LATEST" =~ ^solin-field-v([0-9]+)$ ]] && (( BASH_REMATCH[1] > BASE )); then
              BASE="${BASH_REMATCH[1]}"
            fi
            CODE="$(( BASE + 1 ))"
          fi
          [[ "$CODE" =~ ^[1-9][0-9]{5,8}$ ]] || exit 1
          (( CODE >= 230010 && CODE <= 2100000000 )) || exit 1
          [[ -n "$SOURCE" ]] || exit 1
          {
            echo "code=$CODE"
            echo "tag=solin-field-v$CODE"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed source without secrets
        uses: actions/checkout@v4
        with:
          repository: amantaev0990-code/solin-field
          ref: ${{ steps.meta.outputs.source }}
          path: app
          persist-credentials: false

      - name: Capture exact source commit
        id: source
        run: echo "sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout original release preparation from main
        uses: actions/checkout@v4
        with:
          repository: amantaev0990-code/solin-field
          ref: main
          path: release-config
          sparse-checkout: scripts/prepare-v23-release.mjs
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}

      - name: Test updater and forest logic (no signing key in this job)
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test -s solin-updates.js
          test -s native/android/SolinUpdatePlugin.java
          grep -q 'solin-updates.js' index.html
          npm install --no-audit --no-fund
          node scripts/test-github-updates.cjs
          node scripts/test-update-contract.cjs
          if [[ -f scripts/test-v31-updater.cjs ]]; then node scripts/test-v31-updater.cjs; fi
          if [[ -f scripts/test-v33-ux.cjs ]]; then node scripts/test-v33-ux.cjs; fi
          node scripts/test-card-calculations.cjs
          node scripts/test-quarter-geography-selects.cjs
          node scripts/test-stand-quick-makets.cjs
          npm run build
          node scripts/test-apk-web-parity.cjs
          test ! -e www/solin-private-refs.packed.bin

          # V30 offline assets were never in GitHub V29 branch. Carry over
          # precisely the known V30 release asset, pinned by SHA256.
          if [[ -f compat/v30-assets-overlay.txt ]]; then
            export GH_TOKEN="${{ github.token }}"
            mkdir -p "$RUNNER_TEMP/v30-seed" "$RUNNER_TEMP/v30-files"
            gh release download solin-field-v230010 --repo amantaev0990-code/solin-field \
              --pattern SOLIN-Field-update.apk --dir "$RUNNER_TEMP/v30-seed"
            BASE="$RUNNER_TEMP/v30-seed/SOLIN-Field-update.apk"
            printf '%s  %s\n' '8e59af958899c7ed50fd9fcc7cdc4a21566bf4e0fd2b9e022077d465b041fd1d' "$BASE" | sha256sum -c -
            unzip -q "$BASE" 'assets/public/*' -d "$RUNNER_TEMP/v30-files"
            cp -a "$RUNNER_TEMP/v30-files/assets/public/." www/
            rm -f www/solin-private-refs.packed.bin
            # Android AAPT merges X.json.gz as X.json. The V30 APK already
            # contains the normalized X.json, so remove duplicate .gz files
            # from the older source to prevent Gradle asset collisions.
            for file in www/refs-audit.json.gz \
              www/solin-control-norms.json.gz \
              www/solin-control-source-recovery.json.gz; do
              if [[ -f "${file%.gz}" ]]; then rm -f "$file"; fi
            done
            for entry in \
              'maps/213-1.cmf2:67d30ff85d0d49efc9a467efe585f3aae345073724ae5c60aa895e93e4aa02da' \
              'maps/213-2.cmf2:74043a02e2d74f4e69bc6af8f2b9eea6a5c20a18ad93f677179075003a380076' \
              'solin-map-overview.geojson:15e57e7fafa470c62ddb168aadd63817304f1f60bd1f20927358ef4f0a8ccf03'; do
              file="${entry%%:*}"
              expected="${entry#*:}"
              [[ "$(sha256sum "www/$file" | cut -d' ' -f1)" == "$expected" ]] || exit 1
            done
            echo 'V30 original UI and both field maps preserved byte-for-byte.'
          fi
          # V33 adds tested layout and input improvements ON TOP of the exact
          # V30 app data. Never replace existing card calculations or scripts.
          if [[ -f solin-v33-ux.js && -f solin-v33-ux.css ]]; then
            node - <<'NODE'
          const fs=require('fs');
          const p='www/index.html';
          let html=fs.readFileSync(p,'utf8');
          for(const [needle,tag,place] of [
            ['solin-v33-ux.css','<link rel="stylesheet" href="solin-v33-ux.css?v=33">','</head>'],
            ['solin-v33-ux.js','<script src="solin-v33-ux.js?v=33"></script>','</body>']
          ]) {
            if(html.includes(needle))throw Error('Duplicate V33 bundle '+needle);
            if(!html.includes(place))throw Error('Missing markup anchor '+place);
            html=html.replace(place,tag+place);
          }
          fs.writeFileSync(p,html);
          NODE
            node scripts/test-v33-ux.cjs --built
            node scripts/test-v33-data.cjs --built
          fi
          npx cap add android
          SOLIN_GITHUB_UPDATES=1 node scripts/install-android-mdb.mjs
          npx cap sync android
          SOLIN_RELEASE_VERSION_CODE=${{ steps.meta.outputs.code }} node ../release-config/scripts/prepare-v23-release.mjs
          # The app label stays permanent between all versions.
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">SOLI-N Field</string>#' android/app/src/main/res/values/strings.xml
          grep -q 'registerPlugin(SolinUpdatePlugin.class)' android/app/src/main/java/kz/solin/field/MainActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/solin_update_paths.xml
          if [[ -f scripts/test-v31-updater.cjs ]]; then node scripts/test-v31-updater.cjs --android; fi
          if [[ -f scripts/test-v33-ux.cjs ]]; then node scripts/test-v33-ux.cjs --android; fi
          grep -q 'applicationId "kz.solin.field.v23build"' android/app/build.gradle
          grep -q 'versionCode ${{ steps.meta.outputs.code }}' android/app/build.gradle

      - name: Compile unsigned Android APK
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Use Gradle's official CDN directly, avoiding unreliable GitHub
          # distribution release redirects; the bin distribution is smaller.
          # Download from a verified independent mirror: official Gradle
          # 8.14.3 distribution SHA-256 is pinned by upstream AndroidX.
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip#; s#networkTimeout=10000#networkTimeout=120000#' \
            gradle/wrapper/gradle-wrapper.properties
          printf '\ndistributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531\n' >> \
            gradle/wrapper/gradle-wrapper.properties
          grep -q 'mirrors.huaweicloud.com' gradle/wrapper/gradle-wrapper.properties
          # GitHub's Gradle distribution CDN occasionally returns HTTP 504.
          # Retry transient downloads; fail if compilation itself is broken.
          built=0
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleRelease; then
              built=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 12; fi
          done
          [[ "$built" -eq 1 ]] || exit 1
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          # Verify Android actually packaged the installer callback; otherwise
          # the confirmation prompt could never open on the tablet.
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [[ -f ../../compat/v30-assets-overlay.txt ]]; then
            "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | \
              grep -F 'SolinUpdatePlugin'
          fi
          if unzip -Z1 "$APK" | grep -q '^assets/public/solin-private-refs.packed.bin$'; then
            echo "::error::Private references must only be added during signing"
            exit 1
          fi
          if [[ -f ../../compat/v30-assets-overlay.txt ]]; then
            for entry in \
              'assets/public/maps/213-1.cmf2:67d30ff85d0d49efc9a467efe585f3aae345073724ae5c60aa895e93e4aa02da' \
              'assets/public/maps/213-2.cmf2:74043a02e2d74f4e69bc6af8f2b9eea6a5c20a18ad93f677179075003a380076'; do
              file="${entry%%:*}"
              expected="${entry#*:}"
              actual="$(unzip -p "$APK" "$file" | sha256sum | cut -d' ' -f1)"
              [[ "$actual" == "$expected" ]] || exit 1
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: solin-unsigned-${{ steps.meta.outputs.code }}
          path: app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write}
    env:
      SOLIN_V23_KEYSTORE_PASSWORD: ${{ secrets.SOLIN_V23_KEYSTORE_PASSWORD }}
      CODE: ${{ needs.build.outputs.code }}
      TAG: ${{ needs.build.outputs.tag }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require permanent V23 signing secret
        shell: bash
        run: |
          test -n "$SOLIN_V23_KEYSTORE_PASSWORD" || {
            echo "::error::Configure SOLIN_V23_KEYSTORE_PASSWORD once in GitHub Actions Secrets."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: signing
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: solin-unsigned-${{ needs.build.outputs.code }}
          path: unsigned
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}

      - name: Restore original dictionary, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/solin-v23.p12"
          base64 --decode signing/solin-v23-encrypted.p12.b64 > "$KEY"
          EXPECTED_KEY="$(python3 -c 'import json;print(json.load(open("signing/certificate.json"))["keystoreSha256"])')"
          [[ "$(sha256sum "$KEY" | cut -d' ' -f1)" = "$EXPECTED_KEY" ]] || exit 1
          CERT="$(keytool -list -v -storetype PKCS12 -keystore "$KEY" -alias solin-cloud-lab -storepass:env SOLIN_V23_KEYSTORE_PASSWORD | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT='5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E'
          [[ "$CERT" = "$EXPECTED_CERT" ]] || exit 1

          base64 --decode signing/solin-v23-refs.enc.b64 > "$RUNNER_TEMP/refs.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/refs.enc" -out "$RUNNER_TEMP/refs.bin" \
            -pass env:SOLIN_V23_KEYSTORE_PASSWORD
          EXPECTED_REFS='c2705bf1ecfa98b007fdbecd1b8f7be908b73591ee2eccae327cf88629bb60e5'
          [[ "$(sha256sum "$RUNNER_TEMP/refs.bin" | cut -d' ' -f1)" = "$EXPECTED_REFS" ]] || exit 1

          mkdir -p stage/assets/public release
          cp unsigned/app-release-unsigned.apk stage/base.apk
          cp "$RUNNER_TEMP/refs.bin" stage/assets/public/solin-private-refs.packed.bin
          (cd stage && zip -q -0 base.apk assets/public/solin-private-refs.packed.bin)
          [[ "$(unzip -p stage/base.apk assets/public/solin-private-refs.packed.bin | sha256sum | cut -d' ' -f1)" = "$EXPECTED_REFS" ]] || exit 1
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 stage/base.apk "$RUNNER_TEMP/aligned.apk"
          APK=release/SOLIN-Field-update.apk
          "$TOOLS/apksigner" sign --ks "$KEY" --ks-type PKCS12 \
            --ks-key-alias solin-cloud-lab --ks-pass env:SOLIN_V23_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          # Android build-tools may print either "Signer #1" or "V3.0 Signer".
          # Read a single certificate digest from the verified APK.
          ACTUAL_CERT="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -nE 's/^((Signer #[0-9]+)|(V[0-9.]+ Signer)): certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$ACTUAL_CERT" = "$EXPECTED_CERT" ]] || { echo "::error::Signed APK certificate fingerprint differs"; exit 1; }
          BADGING="$("$TOOLS/aapt" dump badging "$APK" | head -n 1)"
          [[ "$BADGING" = *"package: name='kz.solin.field.v23build'"* ]] || exit 1
          [[ "$BADGING" = *"versionCode='$CODE'"* ]] || exit 1
          [[ "$(unzip -p "$APK" assets/public/solin-private-refs.packed.bin | sha256sum | cut -d' ' -f1)" = "$EXPECTED_REFS" ]] || exit 1
          # These hashes are from the V30 APK actually installed on the tablet.
          # A V31 must preserve both offline maps; never publish a regression.
          for entry in \
            'assets/public/maps/213-1.cmf2:67d30ff85d0d49efc9a467efe585f3aae345073724ae5c60aa895e93e4aa02da' \
            'assets/public/maps/213-2.cmf2:74043a02e2d74f4e69bc6af8f2b9eea6a5c20a18ad93f677179075003a380076' \
            'assets/public/solin-map-overview.geojson:15e57e7fafa470c62ddb168aadd63817304f1f60bd1f20927358ef4f0a8ccf03'; do
            file="${entry%%:*}"
            expected="${entry#*:}"
            actual="$(unzip -p "$APK" "$file" | sha256sum | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]] || { echo "::error::Forest map asset mismatch: $file"; exit 1; }
          done
          sha256sum "$APK" > release/SHA256SUMS.txt
          rm -f "$KEY" "$RUNNER_TEMP/refs.enc" "$RUNNER_TEMP/refs.bin"

      - name: Preserve signed candidate for testing
        uses: actions/upload-artifact@v4
        with:
          name: SOLIN-Field-SIGNED-${{ needs.build.outputs.code }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed update to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/solin-field-v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPO" = 'amantaev0990-code/solin-field' ]] || exit 1
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release already exists. Do not overwrite an existing APK."
            exit 1
          fi
          LATEST="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ "$LATEST" =~ ^solin-field-v([0-9]+)$ ]] && (( CODE <= BASH_REMATCH[1] )); then
            echo "::error::Version is not newer than the published release"
            exit 1
          fi
          gh release create "$TAG" release/SOLIN-Field-update.apk release/SHA256SUMS.txt \
            --repo "$REPO" --target "$SOURCE_SHA" --latest \
            --title "SOLI-N Field - build $CODE" \
            --notes 'Signed in-place update for SOLI-N Field V23+. Back up forest data before installing. Android installation confirmation is required.'
          EXPECTED="sha256:$(sha256sum release/SOLIN-Field-update.apk | cut -d' ' -f1)"
          ACTUAL="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="SOLIN-Field-update.apk") | .digest')"
          [[ "$ACTUAL" = "$EXPECTED" ]] || { echo "::error::Published APK digest differs"; exit 1; }
          echo 'Signed APK is discoverable by the in-app update button.'
