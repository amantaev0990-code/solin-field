name: SOLI-N Field exact web to Android APK

on:
  push:
    branches:
      - android-exact-web-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build exact SOLI-N Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Copy the original website into Android assets
        run: python3 android_web_clone/prepare_assets.py
      - name: Compile Android debug APK
        run: gradle -p android_web_clone --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLIN-Field-Exact-Web-APK
          path: android_web_clone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
