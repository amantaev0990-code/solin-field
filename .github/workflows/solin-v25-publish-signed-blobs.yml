name: SOLI-N Field V25 — publish existing signed APK without secret
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solin-v25-publish-signed-blobs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solin-v25-signed-reassemble
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reconstruct ORIGINAL signed V25 APK from pinned GitHub Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="release/SOLIN-Field-update.apk"
          : > "$APK"
          COUNT=0
          while read -r BLOB _; do
            [[ -z "$BLOB" ]] && continue
            echo "Fetching signed APK fragment $COUNT (Git blob $BLOB)"
            TMP="$RUNNER_TEMP/apk-blob-$COUNT"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BLOB" --jq '.content' | base64 --decode > "$TMP"
            ACTUAL="$(git hash-object "$TMP")"
            [[ "$ACTUAL" == "$BLOB" ]] || { echo "::error::Git blob checksum mismatch for fragment $COUNT"; exit 1; }
            cat "$TMP" >> "$APK"
            rm -f "$TMP"
            COUNT=$((COUNT+1))
          done <<'PINNED_SIGNED_V25_BLOBS'
          81bd4008be8d65e155cd974015063f81a97e33b5  # 00
          5ab409d0abfe94a30adbd2bdbf50b2d02ba298c9  # 01
          4eb1acc62e205732e5d56460007e4091d539fa81  # 02
          fa2eda097cb5d72a44752e6337b4d1ad8c08b277  # 03
          08443aab96ad5984b4164cc11772c3f1cfa0c493  # 04
          791ca6b026c37403402cd3e1456e391e491aef5d  # 05
          93da8c3ad831df28e6573598d115d5910626bd82  # 06
          8b6707cada150c215c21fe7363e26adf799ed7a0  # 07
          b8f8058e93ada6ff0ed44a24ab37cb38b878e387  # 08
          7ecfa1760ba20af82098420df76748f26193a910  # 09
          a8d659ba15b43be333a01d8b83e2cc925b4b8a26  # 10
          a9f21db8dd2d7f3da65902be8d1a58f0343c4216  # 11
          7346ff55817e2845386f1595d8008b45f2d0f64b  # 12
          787250ebf2fdd0d94245eedc1a485dbe10cbfe53  # 13
          af398cceefbfe52cec5fe0a7f11dff4fd2f9753b  # 14
          a021c5cf577d9a399fc3ef1b5171b18dcfc6114b  # 15
          6a7f1e8a1d1df474d5122d617dc1bb92956d3bbd  # 16
          32a96d3a114f5b6536a9a80f8e44fa1f097dec52  # 17
          d07df7d82bb41a9674bf26d6ee508ca793431a4b  # 18
          b61109cb94dd9edbeda184321ea9674981834d60  # 19
          5a9044864958d5aab7bca224a6f247af296967ef  # 20
          4b7aee209a70c86422a389482603ce7405d4295a  # 21
          fa98de4844a5ccee187b3c394afa8b9b32837141  # 22
          PINNED_SIGNED_V25_BLOBS
          [[ "$COUNT" == "23" ]] || { echo "::error::Not all signed fragments fetched"; exit 1; }
          EXPECTED='8e37353a4a85a01520e3c708331ff0c1e38ef96e793f6affcb296f444f53fe1f'
          ACTUAL="$(sha256sum "$APK" | cut -d' ' -f1)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::Final V25 APK SHA-256 mismatch"; exit 1; }
          [[ "$(stat -c%s "$APK")" == "23914293" ]] || { echo "::error::Wrong final size"; exit 1; }
          sha256sum "$APK" > release/SHA256SUMS.txt
          echo "Exact signed APK restored: $ACTUAL"
      - name: Verify original signing certificate, package ID, version, and resources
        shell: bash
        run: |
          set -euo pipefail
          APK=release/SOLIN-Field-update.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          CERT="$("$TOOLS/apksigner" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:lower:]' '[:upper:]')"
          [[ "$CERT" == '5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E' ]] || { echo "::error::Wrong V23/V25 signing certificate"; exit 1; }
          PACKAGE="$("$TOOLS/aapt" dump badging "$APK" | head -1)"
          [[ "$PACKAGE" == *"package: name='kz.solin.field.v23build'"* ]] || { echo "::error::Android package differs from installed V23/V24"; exit 1; }
          [[ "$PACKAGE" == *"versionCode='230005'"* ]] || { echo "::error::Expected V25 versionCode 230005"; exit 1; }
          for ASSET in v25-clean-ui.js v25-clean.css solin-updates.js solin-card-calculations.js solin-apk-mdb.js solin-category-rules.js; do
            unzip -p "$APK" "assets/public/$ASSET" | wc -c | grep -Eq '^[1-9][0-9]{2,}$' || { echo "::error::Missing $ASSET"; exit 1; }
          done
          echo 'Verified original V25 certificate and safe in-place update identity.'
      - name: Store the verified signed APK for release
        uses: actions/upload-artifact@v4
        with:
          name: verified-original-signed-v25-230005
          path: release/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish verified V25 for one-tap updates
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download only verified APK from successful verification job
        uses: actions/download-artifact@v4
        with:
          name: verified-original-signed-v25-230005
          path: release/
      - name: Publish signed public release — no signing secret
        shell: bash
        run: |
          set -euo pipefail
          TAG='solin-field-v230005'
          APK='release/SOLIN-Field-update.apk'
          EXPECTED_SHA='8e37353a4a85a01520e3c708331ff0c1e38ef96e793f6affcb296f444f53fe1f'
          test -s "$APK"
          [[ "$(sha256sum "$APK" | cut -d' ' -f1)" == "$EXPECTED_SHA" ]] || { echo '::error::Verified APK checksum changed'; exit 1; }
          [[ "$(stat -c%s "$APK")" == '23914293' ]] || { echo '::error::Verified APK size changed'; exit 1; }
          grep -q "$EXPECTED_SHA" release/SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --target ca32d438df382466a7b691e9309b3682b3f9cbd3 \
              --title 'SOLI-N Field V25 — новый интерфейс' \
              --notes 'V25 — проверенная подписанная Android-сборка для обновления V24 без удаления приложения. Перед обновлением сделайте резервную копию данных. Реальные полевые испытания ещё не завершены.'
          fi
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$IS_DRAFT" != 'true' ]]; then
            echo '::error::Release is already published. Refusing to overwrite a published APK.'
            exit 1
          fi
          gh release upload "$TAG" "$APK" release/SHA256SUMS.txt --clobber
          ASSET_SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "SOLIN-Field-update.apk") | .size')"
          ASSET_DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "SOLIN-Field-update.apk") | .digest')"
          [[ "$ASSET_SIZE" == '23914293' ]] || { echo '::error::Uploaded APK size mismatch'; exit 1; }
          [[ "$ASSET_DIGEST" == "sha256:$EXPECTED_SHA" ]] || { echo '::error::Uploaded APK digest mismatch'; exit 1; }
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '{tag_name,draft,prerelease,assets:[.assets[]|{name,size,digest}]}'
