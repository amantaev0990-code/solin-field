name: SOLI-N Field V23 permanent signed APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed V23-based source branch'
        required: true
        default: 'feature/v23-one-tap-updates-2026-11-06'
      version_code:
        description: 'Android versionCode; increment for every new update'
        required: true
        default: '230002'

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLIN_V23_KEYSTORE_PASSWORD: ${{ secrets.SOLIN_V23_KEYSTORE_PASSWORD }}
      SOLIN_RELEASE_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Require existing V23 key password (never generate another key)
        shell: bash
        run: |
          if [[ -z "$SOLIN_V23_KEYSTORE_PASSWORD" ]]; then
            echo 'Missing GitHub Actions Secret SOLIN_V23_KEYSTORE_PASSWORD; build blocked.' >&2
            exit 1
          fi
      - name: Checkout V23-based source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Ensure signing files are available from trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: permanent-signing
          sparse-checkout: |
            signing
            scripts/prepare-v23-release.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore encrypted V23 signing key and validate certificate
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode permanent-signing/signing/solin-v23-encrypted.p12.b64 > "$RUNNER_TEMP/v23-signing.p12"
          chmod 600 "$RUNNER_TEMP/v23-signing.p12"
          SHA="$(sha256sum "$RUNNER_TEMP/v23-signing.p12" | cut -d' ' -f1)"
          EXPECTED="$(node -p 'require("./permanent-signing/signing/certificate.json").keystoreSha256')"
          [[ "$SHA" == "$EXPECTED" ]] || { echo 'Encrypted keystore differs from pinned version'; exit 1; }
          KEY_FINGERPRINT="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/v23-signing.p12" -alias solin-cloud-lab -storepass:env SOLIN_V23_KEYSTORE_PASSWORD | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$KEY_FINGERPRINT" == '5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E' ]] || { echo 'V23 signing certificate mismatch: blocked'; exit 1; }
      - name: Install and stage native assets
        shell: bash
        env:
          SOLIN_GITHUB_UPDATES: '1'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          node scripts/test-update-contract.cjs
          npx cap add android
          node scripts/install-android-mdb.mjs
          test -s android/app/src/main/java/kz/solin/field/SolinUpdatePlugin.java
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          npx cap sync android
          node permanent-signing/scripts/prepare-v23-release.mjs
      - name: Compile unsigned release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Align, sign, and verify with permanent V23 identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner" && test -x "$BUILD_TOOLS/zipalign"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/v23-aligned.apk"
          mkdir -p release
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/v23-signing.p12" --ks-type PKCS12 \
            --ks-key-alias solin-cloud-lab \
            --ks-pass env:SOLIN_V23_KEYSTORE_PASSWORD \
            --out release/SOLIN-Field-V23-update.apk "$RUNNER_TEMP/v23-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release/SOLIN-Field-V23-update.apk
          SIGNED_FINGERPRINT="$($BUILD_TOOLS/apksigner verify --print-certs release/SOLIN-Field-V23-update.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          [[ "$SIGNED_FINGERPRINT" == '5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E' ]] || { echo 'Final APK signer mismatch'; exit 1; }
          "$BUILD_TOOLS/aapt" dump badging release/SOLIN-Field-V23-update.apk | head -1 | grep "package: name='kz.solin.field.v23build'" || { echo 'APK package ID mismatch'; exit 1; }
      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLIN-Field-V23-permanent-signed-update
          path: release/SOLIN-Field-V23-update.apk
          if-no-files-found: error
          retention-days: 30