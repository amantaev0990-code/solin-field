name: MDB service tests
on:
  push:
    paths:
      - "mdb-service/**"
      - ".github/workflows/mdb-service-tests.yml"
  pull_request:
    paths:
      - "mdb-service/**"
      - ".github/workflows/mdb-service-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mdb-service/pom.xml
      - name: Test real Jet MDB generation
        run: mvn -B -ntp -f mdb-service/pom.xml verify
