name: SOLI-N Field — signed GitHub updater release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'New Android versionCode (higher than every previously installed version)'
        required: true
        default: '230004'
      publish:
        description: 'Publish APK publicly to GitHub Releases only after field testing'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build-signed-update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOLIN_V23_KEYSTORE_PASSWORD: ${{ secrets.SOLIN_V23_KEYSTORE_PASSWORD }}
      SOLIN_RELEASE_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Block unsafe unsigned or re-keyed builds
        shell: bash
        run: |
          if [[ -z "$SOLIN_V23_KEYSTORE_PASSWORD" ]]; then
            echo 'Missing SOLIN_V23_KEYSTORE_PASSWORD. Existing V23 signing key is mandatory.' >&2
            exit 1
          fi
      - name: Checkout reviewed updater branch, not main
        uses: actions/checkout@v4
        with:
          ref: feature/v23-one-tap-updates-2026-11-06
          path: app
      - name: Checkout encrypted V23 resources and permanent signing tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: release-config
          sparse-checkout: |
            signing
            scripts/prepare-v23-release.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Decrypt private V23 dictionary ONLY on the runner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode release-config/signing/solin-v23-refs.enc.b64 > "$RUNNER_TEMP/solin-refs.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/solin-refs.enc" -out "$RUNNER_TEMP/solin-private-refs.packed.bin" \
            -pass env:SOLIN_V23_KEYSTORE_PASSWORD
          ACTUAL="$(sha256sum "$RUNNER_TEMP/solin-private-refs.packed.bin" | cut -d' ' -f1)"
          [[ "$ACTUAL" == "c2705bf1ecfa98b007fdbecd1b8f7be908b73591ee2eccae327cf88629bb60e5" ]] || {
            echo 'Private reference data differ from the installed V23 baseline; block release.'
            exit 1
          }
          echo "SOLIN_PRIVATE_REFERENCE_PACK=$RUNNER_TEMP/solin-private-refs.packed.bin" >> "$GITHUB_ENV"
      - name: Install dependencies and run updater/core safeguards
        working-directory: app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node scripts/test-github-updates.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-quarter-geography-selects.cjs
      - name: Stage original full V23 reference pack and Android updater
        working-directory: app
        run: |
          set -euo pipefail
          npm run build
          test -s www/solin-private-refs.packed.bin
          cmp "$SOLIN_PRIVATE_REFERENCE_PACK" www/solin-private-refs.packed.bin
          npx cap add android
          SOLIN_GITHUB_UPDATES=1 node scripts/install-android-mdb.mjs
          npx cap sync android
          node ../release-config/scripts/prepare-v23-release.mjs
          test -s android/app/src/main/java/kz/solin/field/SolinUpdatePlugin.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
      - name: Assemble unsigned Android APK with V23 data and native updater
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign and verify release using permanent V23 identity
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          base64 --decode ../release-config/signing/solin-v23-encrypted.p12.b64 > "$RUNNER_TEMP/solin-v23.p12"
          chmod 600 "$RUNNER_TEMP/solin-v23.p12"
          EXPECTED_KEY="$(node -p 'require("../release-config/signing/certificate.json").keystoreSha256')"
          CURRENT_KEY="$(sha256sum "$RUNNER_TEMP/solin-v23.p12" | cut -d' ' -f1)"
          [[ "$EXPECTED_KEY" == "$CURRENT_KEY" ]] || { echo 'Changed signing keystore'; exit 1; }
          FINGERPRINT="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/solin-v23.p12" -alias solin-cloud-lab -storepass:env SOLIN_V23_KEYSTORE_PASSWORD | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$FINGERPRINT" == '5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E' ]] || { echo 'Wrong V23 certificate'; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$SRC"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          mkdir -p release
          APK=release/SOLIN-Field-update.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/solin-v23.p12" --ks-type PKCS12 \
            --ks-key-alias solin-cloud-lab --ks-pass env:SOLIN_V23_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          SIGNED="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          [[ "$SIGNED" == "$FINGERPRINT" ]] || { echo 'Changed APK certificate'; exit 1; }
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -1 | grep "package: name='kz.solin.field.v23build'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -1 | grep "versionCode='${{ inputs.version_code }}'"
          test "$(unzip -p "$APK" assets/public/solin-private-refs.packed.bin | sha256sum | cut -d' ' -f1)" = 'c2705bf1ecfa98b007fdbecd1b8f7be908b73591ee2eccae327cf88629bb60e5'
          rm -f "$RUNNER_TEMP/solin-v23.p12"
          echo "Updater APK signed and verified, original private dictionary intact."
      - name: Save candidate APK for manual field-testing
        uses: actions/upload-artifact@v4
        with:
          name: SOLIN-Field-updater-candidate-${{ inputs.version_code }}
          path: app/release/SOLIN-Field-update.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified version to public GitHub Releases (explicit opt-in)
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: app
        run: |
          set -euo pipefail
          TAG="solin-field-v${{ inputs.version_code }}"
          gh release create "$TAG" release/SOLIN-Field-update.apk \
            --title "SOLI-N Field — обновление ${{ inputs.version_code }}" \
            --notes "Официальное обновление для SOLI-N Field V23+. Подпись и справочники проверены. Для установки потребуется подтверждение Android." \
            --latest
