name: SOLI-N Field mobile card
on:
  push:
    paths:
      - "card-assist-test.cjs"
      - "references-ui-test.cjs"
      - "named-controls-test.cjs"
      - "control-engine-test.cjs"
      - "control-ui-test.cjs"
      - "solin-access-expression.js"
      - "solin-access-sql.js"
      - "solin-native-control*"
      - "native-control-test.cjs"
      - "source-recovery-test.cjs"
      - "source-recovery-ui-test.cjs"
      - "tests/native-control-positive.json"
      - "scripts/build-native-control-data.cjs"
      - "solin-control*"
      - "solin-field-core.js"
      - "solin-workspace.js"
      - "transfer-address-test.cjs"
      - "scripts/build-control-data.py"
      - "solin-named-controls.js"
      - "solin-readable.js"
      - "solin-readable.css"
      - "solin-workflow.js"
      - "solin-card-assist.js"
      - "solin-card-assist.css"
      - "solin-card-editor.js"
      - "solin-card-editor.css"
      - "index.html"
      - "sw.js"
      - ".github/workflows/card-assist-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          node --check solin-card-editor.js
          node --check solin-card-assist.js
          node --check card-assist-test.cjs
      - name: Test card on a phone-sized browser
        run: node card-assist-test.cjs

      - name: Test readable references and mobile menu
        run: node references-ui-test.cjs

      - name: Test named control quarter context
        run: node named-controls-test.cjs

      - name: Test direct control predicates and Access expressions
        run: node control-engine-test.cjs

      - name: Test native query preparation, numbering, rounding and transactions
        run: node native-control-test.cjs

      - name: Test verified source recovery without replacing edits
        run: |
          node source-recovery-test.cjs
          node source-recovery-ui-test.cjs

      - name: Test mobile control flow and offline execution
        run: node control-ui-test.cjs

      - name: Verify Transfer address identity without Access
        run: |
          node --check solin-workspace.js
          node --check transfer-address-test.cjs
          node transfer-address-test.cjs

