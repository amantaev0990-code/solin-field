name: Android APK check (offline MDB prototype)
on:
  workflow_dispatch:
  push:
    paths:
      # Any change to the PWA must trigger a fresh Android build.
      # Previously only Android source changes triggered APK builds, leaving
      # the installed APK stale even after new card fixes were published.
      - '*.js'
      - '*.css'
      - '*.html'
      - '*.json'
      - '*.gz'
      - quarters/**
      - refs/**
      - vendor/**
      - package.json
      - capacitor.config.json
      - scripts/**
      - native/android/**
      - .github/workflows/solin-android-apk.yml
concurrency:
  group: solin-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The setup action default includes the removed SDK package `tools`.
      # Android command-line tools are installed by the action itself; only
      # request the still supported platform-tools package here.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Stage existing SOLI-N Field web assets
        run: npm run build
      - name: Gate candidate APK on Cloud Lab logic and preservation checks
        run: npm run test:logic
      - name: Verify forest, quarter, stand and Maket dependencies
        run: |
          node scripts/test-system-links.cjs
          node scripts/test-quarter-geography-selects.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-maket5-stock-breakdown.cjs
      - name: Verify Android staged assets and blank MDB only
        run: node scripts/test-android-assets.cjs
      - name: Verify exact GitHub Pages vs native APK source parity
        run: node scripts/test-apk-web-parity.cjs
      - name: Verify real mobile UI in web and APK local asset modes
        run: |
          npm install --no-save --no-package-lock playwright-core
          PLAYWRIGHT_PATH=playwright-core BROWSER_CHANNEL=chrome node scripts/test-apk-mobile-parity.cjs
          PLAYWRIGHT_PATH=playwright-core BROWSER_CHANNEL=chrome node scripts/test-android-selects.cjs
          PLAYWRIGHT_PATH=playwright-core BROWSER_CHANNEL=chrome node scripts/test-cross-device-forest-transfer.cjs
          PLAYWRIGHT_PATH=playwright-core BROWSER_CHANNEL=chrome node scripts/test-tablet-field-fixes.cjs
          PLAYWRIGHT_PATH=playwright-core BROWSER_CHANNEL=chrome node scripts/test-offline-imagery.cjs
      - name: Create native Android project
        run: npx cap add android
      - name: Register offline MDB writer
        run: SOLIN_TABLET_BUILD=1 node scripts/install-android-mdb.mjs
      - name: Sync complete web app
        run: npx cap sync android
      - name: Compile Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: solin-field-offline-mdb-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
