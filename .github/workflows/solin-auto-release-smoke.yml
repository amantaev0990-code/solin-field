name: SOLI-N Field - automation smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solin-auto-release.yml'
      - '.github/workflows/solin-auto-release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation workflow for static validation
        uses: actions/checkout@v4
        with:
          ref: main
          path: automation
          persist-credentials: false
      - name: Validate release workflow syntax and shell scripts
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/automation:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12 .github/workflows/solin-auto-release.yml
      - name: Checkout latest V33 updater and UI source
        uses: actions/checkout@v4
        with:
          repository: amantaev0990-code/solin-field
          ref: feat/v33-desktop-menu-card-ux
          path: app
          persist-credentials: false
      - name: Checkout known release version and package-id preparation
        uses: actions/checkout@v4
        with:
          ref: main
          path: config
          sparse-checkout: scripts/prepare-v23-release.mjs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Validate update flow, app data and Android shell
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node scripts/test-github-updates.cjs
          node scripts/test-update-contract.cjs
          node scripts/test-v31-updater.cjs
          node scripts/test-v33-ux.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-quarter-geography-selects.cjs
          node scripts/test-stand-quick-makets.cjs
          npm run build
          node scripts/test-apk-web-parity.cjs
          npx cap add android
          SOLIN_GITHUB_UPDATES=1 node scripts/install-android-mdb.mjs
          npx cap sync android
          SOLIN_RELEASE_VERSION_CODE=230013 node ../config/scripts/prepare-v23-release.mjs
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">SOLI-N Field</string>#' android/app/src/main/res/values/strings.xml
          grep -q 'registerPlugin(SolinUpdatePlugin.class)' android/app/src/main/java/kz/solin/field/MainActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/solin_update_paths.xml
          node scripts/test-v31-updater.cjs --android
          node scripts/test-v33-ux.cjs --android
          grep -q 'applicationId "kz.solin.field.v23build"' android/app/build.gradle
          grep -q 'versionCode 230013' android/app/build.gradle
          test ! -e www/solin-private-refs.packed.bin
      - name: Compile unsigned APK without signing secrets
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip#; s#networkTimeout=10000#networkTimeout=120000#' \
            gradle/wrapper/gradle-wrapper.properties
          printf '\ndistributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531\n' >> gradle/wrapper/gradle-wrapper.properties
          built=0
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleRelease; then built=1; break; fi
            if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
          done
          [[ "$built" -eq 1 ]] || exit 1
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          if unzip -Z1 "$APK" | grep -q '^assets/public/solin-private-refs.packed.bin$'; then
            echo "::error::Private data leaked into unsigned APK"
            exit 1
          fi
          echo "Unsigned native updater compiled; source data and app identity checks passed."
