name: CarryMap Windows runtime
on:
  push:
    paths:
      - '.github/workflows/carrymap-inspect.yml'
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official CarryMap Windows installer
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cmwin
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://carrymap.com/en/download/carrymap/' -o /tmp/cmwin/download.html
          grep -Eoi 'https?[^"'"'"' <>]+\.(exe|msi)(\?[^"'"'"' <>]+)?' /tmp/cmwin/download.html | sort -u | tee /tmp/cmwin/direct-links.txt || true
          grep -Eoi 'href=["'"'][^"'"']+["'"']' /tmp/cmwin/download.html | grep -Ei 'download|windows|carrymap|exe|msi' | head -200 | tee /tmp/cmwin/hrefs.txt || true
          grep -Ein 'download|windows|exe|msi|carrymap' /tmp/cmwin/download.html | head -300 | tee /tmp/cmwin/page-lines.txt || true
      - name: Install and bundle Wine runtime
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine64 wine32 xvfb xdotool cabextract
          mkdir -p /tmp/winebundle/bin /tmp/winebundle/lib
          cp -a /usr/bin/wine* /tmp/winebundle/bin/ || true
          cp -a /usr/lib/x86_64-linux-gnu/wine /tmp/winebundle/lib/ || true
          cp -a /usr/lib/i386-linux-gnu/wine /tmp/winebundle/lib/ || true
          wine --version | tee /tmp/cmwin/wine-version.txt
          tar -C /tmp -czf /tmp/cmwin/winebundle.tar.gz winebundle
          ls -lh /tmp/cmwin/winebundle.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: carrymap-windows-runtime
          path: /tmp/cmwin
          retention-days: 1
