name: CarryMap Windows installer
on:
  push:
    paths:
      - '.github/workflows/carrymap-inspect.yml'
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download official CarryMap installer
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cmwin
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://carrymap.com/licenses/DownloadFileNoRegistration?fileName=CarryMap.En' -o /tmp/cmwin/carrymap-download
          file /tmp/cmwin/carrymap-download | tee /tmp/cmwin/file.txt
          ls -lh /tmp/cmwin/carrymap-download | tee /tmp/cmwin/size.txt
          sha256sum /tmp/cmwin/carrymap-download | tee /tmp/cmwin/sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cmwin/carrymap-download')
          b=p.read_bytes()[:32]
          print('magic',b)
          if b[:2]==b'MZ': p.rename('/tmp/cmwin/CarryMapSetup.exe')
          elif b[:4]==bytes.fromhex('D0CF11E0'): p.rename('/tmp/cmwin/CarryMapSetup.msi')
          PY
          ls -lh /tmp/cmwin
      - uses: actions/upload-artifact@v4
        with:
          name: carrymap-windows-installer
          path: /tmp/cmwin
          retention-days: 1
