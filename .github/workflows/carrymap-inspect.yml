name: CarryMap format inspection
on:
  push:
    paths:
      - '.github/workflows/carrymap-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack CarryMap Android package
        run: |
          set -euxo pipefail
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://d.apkpure.net/b/XAPK/com.dataeast.carrymap?version=latest' -o /tmp/carrymap.xapk
          mkdir -p /tmp/cmx /tmp/apks
          unzip -q /tmp/carrymap.xapk -d /tmp/cmx
          for a in /tmp/cmx/*.apk; do d=/tmp/apks/$(basename "$a" .apk); mkdir -p "$d"; unzip -q "$a" -d "$d" || true; done
          cp /tmp/apks/config.armeabi_v7a/lib/armeabi-v7a/libcarrymap.interop.so /tmp/carrymap-core.so
          file /tmp/carrymap-core.so
      - name: ARM disassembly around CarryMap internals
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-objdump -d /tmp/carrymap-core.so > /tmp/carrymap-arm-disasm.txt
          strings -a -t x /tmp/carrymap-core.so | grep -Ei 'LZ4D|Lz4C|PSTG|SpatialBlock|LZ4Stream|cmf2 must|Not a cmf2|SQLite format' > /tmp/carrymap-strings.txt || true
          arm-linux-gnueabihf-objdump -T /tmp/carrymap-core.so | c++filt | grep -Ei 'LZ4|compress|decompress|inflate|deflate' > /tmp/carrymap-symbols.txt || true
          ls -lh /tmp/carrymap-core.so /tmp/carrymap-arm-disasm.txt
      - uses: actions/upload-artifact@v4
        with:
          name: carrymap-native-analysis
          path: |
            /tmp/carrymap-core.so
            /tmp/carrymap-strings.txt
            /tmp/carrymap-symbols.txt
            /tmp/carrymap-arm-disasm.txt
          retention-days: 1
