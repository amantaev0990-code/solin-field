name: CarryMap format inspection
on:
  push:
    paths:
      - '.github/workflows/carrymap-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack CarryMap Android package
        run: |
          set -euxo pipefail
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://d.apkpure.net/b/XAPK/com.dataeast.carrymap?version=latest' -o /tmp/carrymap.xapk
          mkdir -p /tmp/cmx /tmp/apks
          unzip -q /tmp/carrymap.xapk -d /tmp/cmx
          for a in /tmp/cmx/*.apk; do d=/tmp/apks/$(basename "$a" .apk); mkdir -p "$d"; unzip -q "$a" -d "$d" || true; done
          echo '=== native libraries ==='
          find /tmp/apks -type f -name '*.so' -print
      - name: Locate CarryMap CMF2 native implementation
        run: |
          set -euxo pipefail
          LIB=''
          while IFS= read -r f; do
            if strings -a "$f" | grep -q 'N8CarryMap12CarryMapFile12SpatialBlockE'; then LIB="$f"; break; fi
          done < <(find /tmp/apks -type f -name '*.so')
          echo "LIB=$LIB"
          test -n "$LIB"
          file "$LIB"
          ls -lh "$LIB"
          echo '=== dynamic symbols ==='
          nm -D -C "$LIB" 2>/dev/null | grep -E 'CarryMap::(IO::LZ4Stream|CarryMapFile::SpatialBlock|IO::DeflateStream|IO::Archive)' | head -500 || true
          echo '=== symbol table ==='
          readelf -Ws "$LIB" 2>/dev/null | c++filt | grep -E 'CarryMap::(IO::LZ4Stream|CarryMapFile::SpatialBlock|IO::DeflateStream|IO::Archive)' | head -500 || true
          echo '=== nearby strings ==='
          strings -a -t x "$LIB" | grep -Ei 'LZ4D|Lz4C|PSTG|SpatialBlock|LZ4Stream|cmf2 must|Not a cmf2|SQLite format' | head -500 || true
          echo '=== sections ==='
          readelf -S "$LIB" | head -120
          cp "$LIB" /tmp/carrymap-core.so
      - name: Disassemble candidate native routines
        run: |
          set -euxo pipefail
          LIB=/tmp/carrymap-core.so
          objdump -d -C "$LIB" > /tmp/disasm.txt || true
          grep -n -E 'CarryMap::IO::LZ4Stream|CarryMap::CarryMapFile::SpatialBlock|LZ4Stream|SpatialBlock::Load' /tmp/disasm.txt | head -200 || true
          echo '=== LZ4 constants/calls ==='
          objdump -T -C "$LIB" | grep -Ei 'LZ4|compress|decompress|inflate|deflate' | head -300 || true
          echo '=== selected raw symbol strings ==='
          strings -a "$LIB" | grep -E '^_?ZN8CarryMap(2IO9LZ4Stream|12CarryMapFile12SpatialBlock)' | head -300 || true
