name: SOLI-N Field — dependent tax card values
on:
  push:
    paths:
      - 'solin-dependent-rules.js'
      - 'solin-usability.js'
      - 'solin-card-editor.js'
      - 'solin-workflow.js'
      - 'scripts/test-cross-editor-dependencies.cjs'
      - 'solin-dependency-audit.js'
      - 'scripts/test-dependency-audit.cjs'
      - 'scripts/test-cross-editor-dependencies.cjs'
      - 'scripts/test-whole-card-dependencies.cjs'
      - 'scripts/test-contextual-comboboxes.cjs'
      - 'scripts/test-dependent-field-rules.cjs'
      - 'scripts/test-category-layer-dependencies.cjs'
      - 'solin-address-context.js'
      - 'app.js'
      - 'solin-workspace.js'
      - 'scripts/test-address-context.cjs'
      - 'solin-card-calculations.js'
      - 'solin-quarter-pickers.js'
      - 'solin-card-editor.css'
      - 'scripts/test-maket5-stock-breakdown.cjs'
      - 'scripts/test-quarter-geography-selects.cjs'
      - 'scripts/test-szap-region-zones.cjs'
      - 'solin-field-core.js'
      - 'scripts/test-card-calculations.cjs'
      - 'scripts/test-stock-autocorrection-ui.cjs'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/solin-dependent-card.yml'
  workflow_dispatch:
jobs:
  original-reference-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and schema safety
        run: |
          node --check solin-dependent-rules.js
          node --check scripts/test-cross-editor-dependencies.cjs
          node --check scripts/test-contextual-comboboxes.cjs
          node --check scripts/test-whole-card-dependencies.cjs
          node --check scripts/test-dependency-audit.cjs
          node --check solin-dependency-audit.js
          node --check solin-usability.js
          node --check solin-card-editor.js
          node --check solin-address-context.js
          node --check solin-workspace.js
          node --check app.js
          node --check solin-card-calculations.js
          node --check solin-quarter-pickers.js
          node --check scripts/test-maket5-stock-breakdown.cjs
          node --check scripts/test-quarter-geography-selects.cjs
          node --check solin-field-core.js
          node --check scripts/test-szap-region-zones.cjs
          node --check solin-workflow.js
          node --check scripts/test-stock-autocorrection-ui.cjs
      - name: Regression — forest type, species, zone, region and Access combo rules
        run: |
          node scripts/test-cross-editor-dependencies.cjs
          node scripts/test-dependent-field-rules.cjs
          node scripts/test-contextual-comboboxes.cjs
          node scripts/test-whole-card-dependencies.cjs
          node scripts/test-dependency-audit.cjs
          node scripts/test-category-layer-dependencies.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-maket5-stock-breakdown.cjs
          node scripts/test-quarter-geography-selects.cjs
          node scripts/test-szap-region-zones.cjs
          node scripts/test-address-context.cjs
          node scripts/card-editor-quarter-test.cjs

  stock-autocorrection-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core
      - name: Real Chrome correction checks — desktop and mobile
        env:
          PLAYWRIGHT_PATH: playwright-core
          BROWSER_CHANNEL: chrome
        run: node scripts/test-stock-autocorrection-ui.cjs
