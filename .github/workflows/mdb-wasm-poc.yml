name: Experimental MDB writer — Blazor WASM
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/mdb-wasm-poc/**'
      - '.github/workflows/mdb-wasm-poc.yml'
jobs:
  build-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Add ONLY the data-free MDB template
        run: |
          cp vendor/solin-empty-transfer-v20261028-27.mdb experiments/mdb-wasm-poc/wwwroot/blank-transfer.mdb
      - name: Publish WebAssembly proof separately
        run: |
          dotnet publish experiments/mdb-wasm-poc/MdbWasmPoc.csproj -c Release -o /tmp/mdwpublish
          test -f /tmp/mdwpublish/wwwroot/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps webkit
      - name: Verify actual MDB write and download in mobile-sized WebKit
        run: |
          mkdir -p /tmp/mdw-www/solin-field/mdb-wasm-poc
          cp -a /tmp/mdwpublish/wwwroot/. /tmp/mdw-www/solin-field/mdb-wasm-poc/
          cp data-meta.json solin-mdb-bridge.js /tmp/mdw-www/solin-field/
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/mdw-www &
          node experiments/mdb-wasm-poc/test-webkit.mjs
          node experiments/mdb-wasm-poc/test-webkit-full.mjs
      - name: Publish isolated proof without modifying Field
        run: |
          mkdir -p mdb-wasm-poc
          cp -a /tmp/mdwpublish/wwwroot/. mdb-wasm-poc/
          git add -f mdb-wasm-poc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'experiment: publish isolated .NET MDB writer WASM proof'
            git push
          fi
