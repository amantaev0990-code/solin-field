name: Install CarryMap Windows
on:
  push:
    paths:
      - '.github/workflows/carrymap-install.yml'
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract official CarryMap
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq msitools p7zip-full
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://carrymap.com/licenses/DownloadFileNoRegistration?fileName=CarryMap.En' -o /tmp/carrymap.zip
          unzip -q /tmp/carrymap.zip -d /tmp/cmsetup
          MSI=$(find /tmp/cmsetup -iname '*.msi' | head -1)
          echo "MSI=$MSI"
          mkdir -p /tmp/cmextract
          msiextract -C /tmp/cmextract "$MSI"
          echo '=== EXE DLL ==='
          find /tmp/cmextract -type f \( -iname '*.exe' -o -iname '*.dll' \) -print | head -300
          echo '=== export / cmf2 / gpkg strings ==='
          find /tmp/cmextract -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | xargs -0 -r strings -a 2>/dev/null | grep -Ei 'cmf2|geopackage|gpkg|export|converter|command.?line|usage:' | sort -u | head -2000 || true
          tar -C /tmp -czf /tmp/carrymap-extracted.tar.gz cmextract
          ls -lh /tmp/carrymap-extracted.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: carrymap-extracted
          path: /tmp/carrymap-extracted.tar.gz
          retention-days: 1
