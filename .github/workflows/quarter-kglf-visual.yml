name: Visual SOLI-N quarter/KGLF parity
on:
  push:
    paths:
      - 'app.js'
      - 'solin-workflow.js'
      - 'scripts/quarter-kglf-visual-test.cjs'
      - '.github/workflows/quarter-kglf-visual.yml'
  workflow_dispatch:
jobs:
  quarter-category-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Desktop quarter/KGLF parity
        run: node scripts/quarter-kglf-visual-test.cjs
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check solin-workflow.js
