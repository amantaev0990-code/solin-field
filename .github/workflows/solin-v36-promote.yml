name: SOLI-N Field - publish verified V36

# This one-shot promotion uses an already successful signed candidate.
# It never rebuilds the app, cannot change the signing key, or replace V35.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/solin-v36-promote.yml']

permissions: {contents: write}

jobs:
  publish-v36:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: amantaev0990-code/solin-field
      TAG: solin-field-v230016
      SOURCE_SHA: d3fbb01f221e78661a3e2b9b1255276722b3c61c
    steps:
      - name: Download exact successful signed candidate
        shell: bash
        run: |
          set -euo pipefail
          RUN=42581656504
          [[ "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .conclusion)" == success ]] || exit 1
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::V36 already exists; never overwrite a release APK."
            exit 1
          fi
          mkdir -p release
          gh run download "$RUN" --repo "$REPO" --name SOLIN-Field-SIGNED-230016 --dir release
          test -s release/SOLIN-Field-update.apk
          test -s release/SHA256SUMS.txt
          sha256sum -c release/SHA256SUMS.txt

      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}

      - name: Verify native installer, package, permanent key, maps, references
        shell: bash
        run: |
          set -euo pipefail
          APK=release/SOLIN-Field-update.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose "$APK"
          CERT="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -nE 's/^((Signer #[0-9]+)|(V[0-9.]+ Signer)): certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$CERT" == '5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E' ]] || exit 1
          BADGING="$("$TOOLS/aapt" dump badging "$APK" | head -n 1)"
          [[ "$BADGING" == *"package: name='kz.solin.field.v23build'"* ]] || exit 1
          [[ "$BADGING" == *"versionCode='230016'"* ]] || exit 1
          for entry in \
            'assets/public/maps/213-1.cmf2:67d30ff85d0d49efc9a467efe585f3aae345073724ae5c60aa895e93e4aa02da' \
            'assets/public/maps/213-2.cmf2:74043a02e2d74f4e69bc6af8f2b9eea6a5c20a18ad93f677179075003a380076' \
            'assets/public/solin-map-overview.geojson:15e57e7fafa470c62ddb168aadd63817304f1f60bd1f20927358ef4f0a8ccf03' \
            'assets/public/solin-private-refs.packed.bin:c2705bf1ecfa98b007fdbecd1b8f7be908b73591ee2eccae327cf88629bb60e5'; do
            file="${entry%%:*}"
            expected="${entry#*:}"
            actual="$(unzip -p "$APK" "$file" | sha256sum | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]] || { echo "::error::Missing or changed $file"; exit 1; }
          done
          for web in 'assets/public/solin-v33-ux.css' 'assets/public/solin-v33-ux.js' 'assets/public/solin-v35-features.js' 'assets/public/solin-v35-motion.css'; do
            [[ "$(unzip -p "$APK" "$web" | wc -c)" -gt 1000 ]] || {
              echo "::error::New V36 workspace asset missing: $web"; exit 1;
            }
          done
          # Prove BOTH user-reported V33 failures were corrected INSIDE the
          # signed APK, not merely in a source branch.
          unzip -p "$APK" assets/public/solin-v33-ux.css | grep -qF 'V34 CRITICAL HIT-BOX FIX'
          unzip -p "$APK" assets/public/solin-v33-ux.js | grep -qF 'guardModalOnlyX()'
          unzip -p "$APK" assets/public/index.html | grep -qF 'solin-v33-ux.js?v=34'
          unzip -p "$APK" assets/public/solin-usability.js | grep -qF "const bar=document.querySelector('.quickActions');"
          if unzip -p "$APK" assets/public/solin-usability.js | grep -qF "document.querySelector('.quickActions').style.display"; then
            echo "::error::V33 null-style crash still present in signed APK"
            exit 1
          fi
          for spec in \
            'assets/public/solin-v35-features.js|chooseGroup(groups)' \
            'assets/public/solin-v35-features.js|v36-screen-in' \
            'assets/public/solin-v35-motion.css|v36-dialog-enter' \
            'assets/public/solin-card-assist.js|openFieldByKey(field)' \
            'assets/public/solin-dependent-rules.js|const fallback=!original' \
            'assets/public/solin-dependent-rules.js|const ambiguous=!groupKnown&&groups.length>1' \
            'assets/public/index.html|solin-v35-features.js?v=35'; do
            entry="${spec%%|*}"
            pattern="${spec#*|}"
            payload="$(unzip -p "$APK" "$entry")"
            [[ "$payload" == *"$pattern"* ]] || { echo "::error::Missing V36 integration: $entry / $pattern"; exit 1; }
          done
          # Verify that the NEW signed web payload has the bounded retry
          # and progress behavior, not just the source branch.
          for check in \
            'assets/public/solin-updates.js|temporaryHttp' \
            'assets/public/solin-updates.js|progressHandle' \
            'assets/public/solin-updates.js|versionCode: release.versionCode' \
            'assets/public/index.html|solin-updates.js?v=36-github-retry'; do
            file="${check%%|*}"
            pattern="${check#*|}"
            content="$(unzip -p "$APK" "$file")"
            [[ "$content" == *"$pattern"* ]] || {
              echo "::error::Missing signed V36 updater feature: $file $pattern"
              exit 1
            }
          done
          echo 'V36 signed APK: V35 forest features preserved; retry-aware updater installed, original signature/maps verified.'

      - name: Publish exactly the verified V36 APK
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          [[ "$LATEST" == 'solin-field-v230015' ]] || { echo "::error::Unexpected latest release: $LATEST"; exit 1; }
          gh release create "$TAG" release/SOLIN-Field-update.apk release/SHA256SUMS.txt \
            --repo "$REPO" --target "$SOURCE_SHA" --latest \
            --title 'SOLI-N Field V36 — исправление HTTP 504 и загрузки обновлений' \
            --notes 'V36: временные сбои GitHub (HTTP 504, 503, 502, 500, 429 и сетевые обрывы) больше не прерывают загрузку сразу: Android делает до 4 ограниченных повторных попыток, проверка метаданных GitHub — до 3. На кнопке обновлений показывается прогресс и повторная попытка. Постоянная подпись, SHA-256, пакет kz.solin.field.v23build, подтверждение через Android PackageInstaller, офлайн-карты, данные и новые функции макета 3 из V35 сохранены. Приложение не обращается к лесничествам во время обновления. GitHub может оставаться недоступным; после исчерпания попыток можно установить APK вручную поверх текущей версии без удаления приложения. Не отключайте Google Play Защиту и сохраните резервную копию перед обновлением. Реальное подтверждение на планшете ещё требуется.'
          EXPECTED="sha256:$(sha256sum release/SOLIN-Field-update.apk | cut -d' ' -f1)"
          ACTUAL="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="SOLIN-Field-update.apk") | .digest')"
          [[ "$EXPECTED" == "$ACTUAL" ]] || { echo "::error::Uploaded GitHub APK digest differs"; exit 1; }
          echo 'Public release V36 is verified and immutable by convention.'
