name: SOLI-N Field — updater compile and safety check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v23-one-tap-updates-2026-11-06
    paths:
      - 'solin-updates.js'
      - 'solin-workflow.js'
      - 'solin-workflow.css'
      - 'scripts/test-stand-quick-makets.cjs'
      - 'index.html'
      - 'scripts/test-github-updates.cjs'
      - 'scripts/install-android-mdb.mjs'
      - 'native/android/SolinUpdatePlugin.java'
      - '.github/workflows/solin-github-updater-smoke.yml'

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Install JS/Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Test updater without network or installation
        run: |
          node --check solin-updates.js
          node --check scripts/install-android-mdb.mjs
          node scripts/test-github-updates.cjs
          node scripts/test-stand-quick-makets.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-quarter-geography-selects.cjs
      - name: Stage production PWA resources without touching original MDB files
        run: npm run build
      - name: Generate native Android app and register updater only in test
        run: |
          npx cap add android
          SOLIN_GITHUB_UPDATES=1 node scripts/install-android-mdb.mjs
          npx cap sync android
          grep -q 'registerPlugin(SolinUpdatePlugin.class)' android/app/src/main/java/kz/solin/field/MainActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'solin_update_paths' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/kz/solin/field/SolinUpdatePlugin.java
      - name: Compile Android updater to verify Java and manifest
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      # Deliberately DO NOT upload/install this ephemeral debug-key APK:
      # its certificate does not match V23 and would not update user data.
