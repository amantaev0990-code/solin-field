name: Test real MDB creation inside browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mdb-service/src/main/java/kz/solin/mdb/BrowserMdbWriter.java"
      - "mdb-service/src/main/java/kz/solin/mdb/BrowserSmokeFixture.java"
      - "mdb-service/browser-smoke.html"
      - ".github/workflows/test-browser-mdb.yml"
permissions:
  contents: read
jobs:
  chromium-jet-mdb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: mdb-service/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the real MDB writer
        run: mvn -B -ntp -f mdb-service/pom.xml verify
      - name: Generate synthetic Jet MDB input and modified data
        run: |
          java -cp mdb-service/target/mdb-export-service-0.1.0.jar kz.solin.mdb.BrowserSmokeFixture /tmp/solin-smoke/fixture
          mkdir -p /tmp/solin-smoke/vendor
          cp mdb-service/target/mdb-export-service-0.1.0.jar /tmp/solin-smoke/vendor/solin-browser-mdb.jar
          cp mdb-service/browser-smoke.html /tmp/solin-smoke/browser-smoke.html

      - name: Install browser automation
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1 http-server@14.1.1
      - name: Start CheerpJ-compatible server supporting HTTP Range
        run: |
          npx http-server /tmp/solin-smoke -a 127.0.0.1 -p 8765 -s >/tmp/solin-browser-http.log 2>&1 &
          sleep 2
          curl -fsSI -H 'Range: bytes=0-100' http://127.0.0.1:8765/vendor/solin-browser-mdb.jar | grep -q '206 Partial Content'
      - name: Run Jet MDB writer INSIDE a Chromium browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const errors=[];
          const browser=await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox','--disable-dev-shm-usage']
          });
          try {
            const page=await browser.newPage();
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',msg=>{ if(msg.type()==='error')errors.push(msg.text()); });
            await page.goto('http://127.0.0.1:8765/browser-smoke.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>Boolean(document.body.dataset.result),null,{timeout:180000});
            const state=await page.evaluate(()=>({
              result:document.body.dataset.result,
              error:document.body.dataset.error||'',
              status:document.getElementById('status').textContent
            }));
            console.log(JSON.stringify({state,errors:errors.slice(-8)},null,2));
            if(state.result!=='passed')process.exitCode=1;
          } finally {
            await browser.close();
          }
          NODE
