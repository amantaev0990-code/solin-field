name: Publish experimental browser Jet MDB engine
on:
  push:
    branches: [main]
    paths:
      - "mdb-service/pom.xml"
      - "mdb-service/src/main/java/**"
      - "mdb-service/src/test/java/**"
      - ".github/workflows/build-browser-mdb.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: mdb-service/pom.xml
      - name: Run Access MDB creation/readback tests and compile fat JAR
        run: mvn -B -ntp -f mdb-service/pom.xml verify
      - name: Stage browser executable (never stage original MDB)
        run: |
          test -f mdb-service/target/mdb-export-service-0.1.0.jar
          mkdir -p vendor
          cp mdb-service/target/mdb-export-service-0.1.0.jar vendor/solin-browser-mdb.jar
          test "$(wc -c < vendor/solin-browser-mdb.jar)" -gt 100000
          unzip -tq vendor/solin-browser-mdb.jar
      - name: Publish checked bytecode for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp vendor/solin-browser-mdb.jar /tmp/solin-mdb-writer.jar
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/solin-mdb-writer.jar vendor/solin-browser-mdb.jar
            cp /tmp/solin-mdb-writer.jar vendor/solin-browser-mdb-v20261028-19.jar
            git add -f vendor/solin-browser-mdb.jar vendor/solin-browser-mdb-v20261028-19.jar
            if git diff --cached --quiet; then
              echo "MDB writer bundle unchanged"
              exit 0
            fi
            git commit -m "Publish browser-only Jet MDB writer bytecode [skip ci]"
            if git push origin HEAD:main; then
              echo "Published verified JAR"
              exit 0
            fi
            sleep 2
          done
          echo "Could not fast-forward origin/main after retries"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: solin-browser-mdb-java-archive
          path: vendor/solin-browser-mdb.jar
          retention-days: 7
