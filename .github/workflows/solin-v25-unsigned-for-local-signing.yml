name: SOLI-N Field — unsigned V25 packaging for local private signing

on:
  push:
    branches: [design/v25-clean-interface-2026-11-06]
    paths:
      - '.github/workflows/solin-v25-unsigned-for-local-signing.yml'

permissions:
  contents: read

jobs:
  unsigned-v25:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v25-clean-interface-2026-11-06
          path: app
      - uses: actions/checkout@v4
        with:
          ref: main
          path: verified-signing
          sparse-checkout: |
            scripts/prepare-v23-release.mjs
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Verify source tests and native updater
        working-directory: app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check v25-clean-ui.js
          node scripts/test-github-updates.cjs
          node scripts/test-stand-quick-makets.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-quarter-geography-selects.cjs
          npm run build
          node scripts/test-apk-web-parity.cjs
          npx cap add android
          SOLIN_GITHUB_UPDATES=1 node scripts/install-android-mdb.mjs
          npx cap sync android
          SOLIN_RELEASE_VERSION_CODE=230005 node ../verified-signing/scripts/prepare-v23-release.mjs
      - name: Compile unsigned V25 release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stage unsigned APK and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p deliverable
          cp app/android/app/build/outputs/apk/release/app-release-unsigned.apk deliverable/V25-unsigned.apk
          cp "$TOOLS/lib/apksigner.jar" deliverable/apksigner.jar
          cp "$TOOLS/zipalign" deliverable/zipalign
          cp "$TOOLS/aapt" deliverable/aapt
          (cd deliverable && sha256sum * > SHA256SUMS.txt)
      - name: Save unsigned candidate (NOT installable until signed)
        uses: actions/upload-artifact@v4
        with:
          name: SOLIN-V25-UNSIGNED-LOCAL-SIGNING
          path: deliverable/
          retention-days: 10
          if-no-files-found: error
