name: SOLI-N Field — publish V25 for in-app updates

# A push tests the pipeline WITHOUT accessing signing secrets or publishing.
# The owner runs "Run workflow" after adding the one-time repository secret.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solin-publish-v25.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a stable, PUBLIC GitHub Release discoverable by the Android app'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: solin-v25-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout PINNED and verified V25 source (not a moving branch)
        uses: actions/checkout@v4
        with:
          repository: amantaev0990-code/solin-field
          ref: ca32d438df382466a7b691e9309b3682b3f9cbd3
          path: app
          persist-credentials: false
      - name: Checkout trusted release preparation (no secrets at build time)
        uses: actions/checkout@v4
        with:
          path: release-config
          sparse-checkout: |
            scripts/prepare-v23-release.mjs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Regression tests — controls, tax calculations, forest types, updater
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check v25-clean-ui.js
          node scripts/test-github-updates.cjs
          node scripts/test-card-calculations.cjs
          node scripts/test-quarter-geography-selects.cjs
          node scripts/test-stand-quick-makets.cjs
          npm run build
          node scripts/test-apk-web-parity.cjs
          npx cap add android
          SOLIN_GITHUB_UPDATES=1 node scripts/install-android-mdb.mjs
          npx cap sync android
          SOLIN_RELEASE_VERSION_CODE=230005 node ../release-config/scripts/prepare-v23-release.mjs
          grep -q 'registerPlugin(SolinUpdatePlugin.class)' android/app/src/main/java/kz/solin/field/MainActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/kz/solin/field/SolinUpdatePlugin.java
          test -s www/v25-clean-ui.js
          test -s www/v25-clean.css
          test -s www/solin-apk-mdb.js
      - name: Build UNSIGNED APK; secret is unavailable in this job
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ! unzip -Z1 app/build/outputs/apk/release/app-release-unsigned.apk | grep -q '^assets/public/solin-private-refs.packed.bin$'
      - name: Pass only unsigned build to isolated signing job
        uses: actions/upload-artifact@v4
        with:
          name: solin-v25-unsigned-230005
          path: app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOLIN_V23_KEYSTORE_PASSWORD: ${{ secrets.SOLIN_V23_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require existing V23 key password, never create replacement key
        shell: bash
        run: |
          if [[ -z "$SOLIN_V23_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set repository Actions secret SOLIN_V23_KEYSTORE_PASSWORD once before publishing."
            exit 1
          fi
      - name: Fetch only encrypted key and encrypted original dictionary
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            signing
          persist-credentials: false
      - name: Fetch tested unsigned APK from build job
        uses: actions/download-artifact@v4
        with:
          name: solin-v25-unsigned-230005
          path: unsigned
      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Decrypt dictionary and sign using PINNED V23 certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/solin-v23.p12"
          base64 --decode signing/solin-v23-encrypted.p12.b64 > "$KEY"
          KEY_SHA="$(sha256sum "$KEY" | cut -d' ' -f1)"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("signing/certificate.json"))["keystoreSha256"])')"
          [[ "$KEY_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::V23 keystore changed"; exit 1; }
          CERT="$(keytool -list -v -storetype PKCS12 -keystore "$KEY" -alias solin-cloud-lab -storepass:env SOLIN_V23_KEYSTORE_PASSWORD | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT='5A1C2E2BF2EFE5AA7382674B651533A11D2B93C802A1C09ADC72656C5A29ED7E'
          [[ "$CERT" == "$EXPECTED_CERT" ]] || { echo "::error::V23 signing certificate mismatch"; exit 1; }

          base64 --decode signing/solin-v23-refs.enc.b64 > "$RUNNER_TEMP/refs.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/refs.enc" -out "$RUNNER_TEMP/solin-private-refs.packed.bin" \
            -pass env:SOLIN_V23_KEYSTORE_PASSWORD
          EXPECTED_REFS='c2705bf1ecfa98b007fdbecd1b8f7be908b73591ee2eccae327cf88629bb60e5'
          REFS_SHA="$(sha256sum "$RUNNER_TEMP/solin-private-refs.packed.bin" | cut -d' ' -f1)"
          [[ "$REFS_SHA" == "$EXPECTED_REFS" ]] || { echo "::error::Original forest reference data mismatch"; exit 1; }

          # Inject the SAME validated private reference bundle in UNSIGNED APK,
          # then align and sign. Never publish without this package asset.
          mkdir -p release/stage/assets/public
          cp unsigned/app-release-unsigned.apk release/stage/base.apk
          cp "$RUNNER_TEMP/solin-private-refs.packed.bin" release/stage/assets/public/solin-private-refs.packed.bin
          (cd release/stage && zip -q -0 base.apk assets/public/solin-private-refs.packed.bin)
          CHECK="$(unzip -p release/stage/base.apk assets/public/solin-private-refs.packed.bin | sha256sum | cut -d' ' -f1)"
          [[ "$CHECK" == "$EXPECTED_REFS" ]] || { echo "::error::APK forest references corrupted"; exit 1; }
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 release/stage/base.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p release/output
          APK=release/output/SOLIN-Field-update.apk
          "$TOOLS/apksigner" sign --ks "$KEY" --ks-type PKCS12 \
            --ks-key-alias solin-cloud-lab --ks-pass env:SOLIN_V23_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          SIGNED="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          [[ "$SIGNED" == "$EXPECTED_CERT" ]] || { echo "::error::APK signed with wrong certificate"; exit 1; }
          PKG="$("$TOOLS/aapt" dump badging "$APK" | head -1)"
          [[ "$PKG" == *"package: name='kz.solin.field.v23build'"* ]] || { echo "::error::Wrong Android packageId"; exit 1; }
          [[ "$PKG" == *"versionCode='230005'"* ]] || { echo "::error::Wrong versionCode"; exit 1; }
          for ASSET in v25-clean.css v25-clean-ui.js solin-updates.js solin-card-calculations.js solin-apk-mdb.js solin-category-rules.js; do
            unzip -p "$APK" "assets/public/$ASSET" | test "$(wc -c)" -gt 100 || { echo "::error::Missing $ASSET"; exit 1; }
          done
          unzip -p "$APK" assets/public/solin-private-refs.packed.bin | sha256sum | grep -q "$EXPECTED_REFS"
          sha256sum "$APK" > release/output/SHA256SUMS.txt
          echo 'Signed release preserves package, original dictionary, MDB code, and permanent V23 key.'
          rm -f "$KEY" "$RUNNER_TEMP/solin-private-refs.packed.bin"
      - name: Keep verified candidate available before publication
        uses: actions/upload-artifact@v4
        with:
          name: SOLIN-V25-verified-signed-230005
          path: release/output/
          retention-days: 30
          if-no-files-found: error
      - name: Publish V25 for ONE-TAP in-app updates (PUBLIC)
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='solin-field-v230005'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; never replace an existing APK."
            exit 1
          fi
          gh release create "$TAG" release/output/SOLIN-Field-update.apk release/output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target ca32d438df382466a7b691e9309b3682b3f9cbd3 \
            --title 'SOLI-N Field V25 — новый интерфейс' \
            --notes 'V25: единая навигация, карточка Участок/Древостой/Макеты, характеристика типа леса и быстрый выбор макетов. Полевая установка и MDB-экспорт на реальном устройстве ещё требуют проверки. Перед обновлением сохраните резервный экспорт. APK подписан постоянным сертификатом SOLI-N Field V23.' \
            --latest
          EXPECTED_DIGEST="sha256:$(sha256sum release/output/SOLIN-Field-update.apk | cut -d' ' -f1)"
          ACTUAL_DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "SOLIN-Field-update.apk") | .digest')"
          [[ "$ACTUAL_DIGEST" == "$EXPECTED_DIGEST" ]] || { echo "::error::Published release digest mismatch"; exit 1; }
          echo 'Published signed V25. The SOLI-N Field update button can now discover it.'
