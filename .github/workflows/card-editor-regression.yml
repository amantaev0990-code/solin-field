name: SOLI-N Field — taxation card regressions
on:
  push:
    paths:
      - 'solin-card-editor.js'
      - 'solin-category-rules.js'
      - 'refs/SKU.json'
      - 'scripts/test-category-rule-engine.cjs'
      - 'scripts/test-category-layer-dependencies.cjs'
      - 'solin-card-editor.css'
      - 'solin-card-assist.js'
      - 'solin-card-assist.css'
      - 'scripts/card-editor-quarter-test.cjs'
      - '.github/workflows/card-editor-regression.yml'
  workflow_dispatch:
jobs:
  verify-quarter-and-makets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact original quarter rows and navigator
        run: node scripts/card-editor-quarter-test.cjs
      - name: Verify all 123 category profiles and original KU to IAR dependencies
        run: |
          node scripts/test-category-rule-engine.cjs
          node scripts/test-category-layer-dependencies.cjs
      - name: Check card JavaScript syntax
        run: |
          node --check solin-category-rules.js
          node --check solin-card-editor.js
          node --check solin-card-assist.js
