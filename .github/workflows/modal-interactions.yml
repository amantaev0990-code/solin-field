name: SOLI-N Field — iPhone modal interactions
on:
  push:
    paths:
      - 'app.js'
      - 'solin-field-core.js'
      - 'solin-modal-stability.css'
      - 'index.html'
      - 'scripts/test-modal-interactions.mjs'
      - 'scripts/test-modal-source-contract.cjs'
      - '.github/workflows/modal-interactions.yml'
  workflow_dispatch:
jobs:
  ios-modal-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check core JavaScript
        run: |
          node --check app.js
          node --check solin-field-core.js
          node --check scripts/test-modal-source-contract.cjs
          node scripts/test-modal-source-contract.cjs
          node --check scripts/test-modal-interactions.mjs
      - name: Install mobile WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps webkit
      - name: Touch input, backdrop and close-button regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . &
          node scripts/test-modal-interactions.mjs
